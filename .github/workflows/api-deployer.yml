name: API Deployer

on:
  push:
    branches: 
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.0.x' ]
    
    name: API Deployer BUILD

    env:
      LambdaName: ${{ github.ref == 'refs/heads/main' && 'AuthApiLambdaFunction' || 'AuthApiTestLambdaFunction' }}
      PublishDir: ${{ github.workspace }}/artifacts/auth

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v2
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        # ReadyToRun: Lambda soğuk açılışta JIT yapmasın (linux-x64 = dotnet8 x86_64 çalışma ortamı).
        # Çıktıyı sabit klasöre yaz: RID'li publish varsayılan olarak linux-x64/publish altına gider
        # ve aşağıdaki paketleme adımı eski net8.0/publish yolunu aradığında deploy sessizce dururdu.
        run: dotnet publish src/Api/Api.csproj -c Release -r linux-x64 --self-contained false -p:PublishReadyToRun=true --output "${PublishDir}"

      - name: Zip Publish Output
        run: zip -qq -r "${GITHUB_WORKSPACE}/bundle.zip" .
        working-directory: ${{ env.PublishDir }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: AWS Deploy
        run: aws lambda update-function-code --function-name "${LambdaName}" --zip-file "fileb://${GITHUB_WORKSPACE}/bundle.zip"
